services:
  # 1. Managed Redis Cache (Key Value)
  - type: keyvalue
    name: search-redis
    plan: free
    ipAllowList: [] 

  # 2. Python FastAPI (AI & Search Engine)
  - type: web
    name: search-ai-engine
    env: docker
    dockerContext: ./ai-engine
    dockerfilePath: ./ai-engine/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_URL
        value: https://router.huggingface.co/hf-inference/models/sentence-transformers/all-MiniLM-L6-v2/pipeline/feature-extraction

  # 3. Node.js / Express Proxy Backend
  - type: web
    name: search-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_API_URL
        value: http://search-ai-engine:10000
      - key: AI_ENGINE_URL
        value: http://search-ai-engine:10000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: search-redis
          property: connectionString

  # 4. React Frontend (Vite)
  - type: web
    name: search-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://search-backend.onrender.com
      - key: VITE_API_SEARCH_URL
        value: https://search-backend.onrender.com/api/search