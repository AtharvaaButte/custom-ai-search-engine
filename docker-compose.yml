networks:
  app-network:
    driver: bridge

services:
  # 1. Local Redis Cache
  redis:
    image: redis/redis-stack:latest
    container_name: search-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - app-network

  # 2. Python FastAPI (AI & Search Engine)
  ai-engine:
    build: ./ai-engine
    container_name: search-ai-engine
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./ai-engine/data:/app/data
    depends_on:
      - redis
    networks:
      - app-network

  # 3. Node.js / Express Proxy Backend
  backend:
    build: ./backend
    container_name: search-backend
    ports:
      - "5000:5000"
    environment:
      - PYTHON_API_URL=http://ai-engine:8000
      - AI_ENGINE_URL=http://ai-engine:8000
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - ai-engine
      - redis
    networks:
      - app-network

  # 4. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/search
        - VITE_API_SEARCH_URL=http://localhost:5000/api/search
    container_name: search-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/search
      - VITE_API_SEARCH_URL=http://localhost:5000/api/search
    depends_on:
      - backend
    networks:
      - app-network